name: Deploy

on:
  push:
    tags:
      - "v*" # only deploy on tags starting with v
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: true
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      deployments: write
      contents: read

    env:
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}

    steps:
      - name: Deploy
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }} # required for private repositories
          ref: ${{ env.DEPLOY_REF }}
          wait_deploy: true
          github_deployment: true
          deployment_environment: ${{ env.DEPLOY_REF }}
