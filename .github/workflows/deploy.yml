name: Deploy

on:
  push:
    tags:
      - "v*" # only deploy on tags starting with v
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: true
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve ref to build
        id: resolve_ref_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.ref }}"
          else
            REF="${{ github.ref_name }}"
          fi

          echo "Deploy ref is $REF"
          echo "REF=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve_ref_step.outputs.REF }}

      - name: Deploy
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }} # required for private repos
          ref: ${{ steps.resolve_ref_step.outputs.REF }}
          wait_deploy: true
