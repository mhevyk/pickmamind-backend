name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # fetch full history for git checks

      - name: Ensure tag is on main branch (only for tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_REF=${GITHUB_REF#refs/tags/}
          echo "Tag: $TAG_REF"
          if ! git branch -r --contains "refs/tags/$TAG_REF" | grep -q "origin/main"; then
            echo "Tag $TAG_REF is not on main branch. Exiting."
            exit 1
          fi
          echo "Tag is on main, continuing..."

      - name: Deploy
        uses: johnbeynon/render-deploy-action@v0.0.9
        with:
          service-id: ${{ secrets.SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true
