name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Ensure tag is on main (skip for manual dispatch)
        if: github.event_name != 'workflow_dispatch'
        run: |
          TAG_REF=${GITHUB_REF#refs/tags/}
          echo "Tag push detected: $TAG_REF"

          # Fetch tags to check main branch
          git fetch --tags

          # Ensure tag commit exists on main
          if ! git merge-base --is-ancestor "$TAG_REF" origin/main; then
            echo "Tag $TAG_REF is not on main branch. Exiting."
            exit 1
          fi
          echo "Tag is on main, continuing..."

      - name: Deploy
        uses: johnbeynon/render-deploy-action@v0.0.9
        with:
          service-id: ${{ secrets.SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true
