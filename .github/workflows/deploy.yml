name: Deploy

on:
  push:
    tags:
      - "v*" # Only deploy on tags starting with v
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: true
        default: "main" # prefilled in the UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Determine deploy ref and store as step output
      - name: Set deploy ref
        id: set_ref
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            DEPLOY_REF="${{ github.event.inputs.ref }}"
          else
            # Tag push
            DEPLOY_REF=${GITHUB_REF#refs/tags/}
          fi
          echo "Deploy ref is $DEPLOY_REF"
          echo "deploy_ref=$DEPLOY_REF" >> $GITHUB_OUTPUT

      # Checkout the specific branch or tag
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.set_ref.outputs.deploy_ref }}
          fetch-depth: 1 # minimal fetch
          fetch-tags: true # ensure tags are fetched if needed

      # Optional: sanity check that ref exists
      - name: Verify ref exists
        run: |
          if ! git show-ref --verify --quiet "refs/heads/${{ steps.set_ref.outputs.deploy_ref }}" && \
             ! git show-ref --verify --quiet "refs/tags/${{ steps.set_ref.outputs.deploy_ref }}"; then
            echo "Error: Ref '${{ steps.set_ref.outputs.deploy_ref }}' does not exist locally!"
            exit 1
          fi

      # Deploy
      - name: Deploy
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true
          ref: ${{ steps.set_ref.outputs.deploy_ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }} # Required for private repos
